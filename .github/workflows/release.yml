name: Publish VAAYANA Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag or version being released (e.g., v2.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Linux AppImage Release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies & FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-mal libfuse2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build standalone Linux FastAPI backend
        run: |
          python backend/build_backend.py
          test -x electron/bin/vaayana-backend/vaayana-backend && echo "Linux backend successfully staged!"

      - name: Install Node dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Build React frontend
        run: |
          npm run frontend:build

      - name: Package & Publish Linux AppImage to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --linux AppImage --x64 --publish always

      - name: Verify Release Artifacts & Updater Metadata
        run: |
          echo "=== Built Release Files in dist-electron/ ==="
          ls -lh dist-electron/
          if [ -f dist-electron/latest-linux.yml ]; then
            echo "SUCCESS: Updater metadata latest-linux.yml generated!"
            cat dist-electron/latest-linux.yml
          else
            echo "ERROR: latest-linux.yml not found!"
            exit 1
          fi

      - name: Upload Release Artifacts as Workflow Backup
        uses: actions/upload-artifact@v4
        with:
          name: VAAYANA-Release-Backup-${{ github.ref_name }}
          path: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
            dist-electron/*.blockmap
          retention-days: 14
          if-no-files-found: warn

