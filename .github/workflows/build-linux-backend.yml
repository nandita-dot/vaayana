name: Build Linux Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/build-linux-backend.yml'

jobs:
  build-linux:
    name: Build Ubuntu Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-mal

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build standalone backend with PyInstaller
        run: |
          python backend/build_backend.py

      - name: Verify build artifacts
        run: |
          echo "=== Staged Electron Backend Directory ==="
          ls -la electron/bin/vaayana-backend/
          echo "=== Verifying Executable Binary ==="
          test -x electron/bin/vaayana-backend/vaayana-backend && echo "Binary exists and is executable!"

      - name: Upload Linux Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaayana-backend-linux-x64
          path: electron/bin/vaayana-backend
          retention-days: 14
          if-no-files-found: error
